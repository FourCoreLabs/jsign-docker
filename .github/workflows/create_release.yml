name: JSign Docker Release
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Get JSign version
        id: version
        run: |
          JSIGN_VERSION=$(curl -s https://api.github.com/repos/ebourg/jsign/releases/latest | grep "tag_name" | cut -d '"' -f 4 | sed 's/^v//')
          echo "JSIGN_VERSION=$JSIGN_VERSION" >> $GITHUB_ENV
          echo "version=$JSIGN_VERSION" >> $GITHUB_OUTPUT
      
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/fourcorelabs/jsign-docker:latest, ghcr.io/fourcorelabs/jsign-docker:${{ steps.version.outputs.version }}
          build-args: JSIGN_VERSION=${{ env.JSIGN_VERSION }}